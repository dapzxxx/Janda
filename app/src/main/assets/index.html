<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himz Generate Sensi | Auto Sensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        h1, h2, h3, .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Animated Background */
        .bg-animate {
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #050505 100%);
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
        }

        /* Floating Particles Canvas */
        #canvas-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Glassmorphism - Dipergelap agar lebih elegan */
        .glass-card {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.8);
        }

        /* RGB Border Animation */
        .rgb-border-wrapper {
            position: relative;
            border-radius: 22px;
            padding: 2px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-blue));
            background-size: 300% 300%;
            animation: rgb-anim 4s linear infinite;
        }

        @keyframes rgb-anim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Neon Glow Utility */
        .glow-blue { text-shadow: 0 0 15px var(--neon-blue); }
        .glow-text-gradient {
            background: linear-gradient(to right, #00f3ff, #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(188, 19, 254, 0.5);
        }
        
        .btn-neon {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-neon::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s;
        }

        .btn-neon:hover::after {
            left: 100%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        /* Toast Styling */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            transform: translateY(200%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: var(--neon-blue);
            box-shadow: 0 0 20px 2px var(--neon-blue);
            top: 0;
            left: 0;
            animation: scan 1.5s linear infinite;
            display: none;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* App Icons Style */
        .app-icon {
            width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-icon svg { width: 28px; height: 28px; }
        
        /* Specific Brand Colors */
        .icon-tiktok { background: #000000; border: 1px solid rgba(255,255,255,0.2); color: white; box-shadow: 0 5px 15px rgba(0,243,255,0.2); }
        .icon-tiktok:hover { box-shadow: 0 0 20px rgba(0,243,255,0.6), 0 0 20px rgba(255,0,80,0.6); transform: translateY(-3px); }
        
        .icon-youtube { background: #ff0000; color: white; box-shadow: 0 5px 15px rgba(255,0,0,0.3); }
        .icon-youtube:hover { box-shadow: 0 0 20px rgba(255,0,0,0.6); transform: translateY(-3px); }
        
        .icon-whatsapp { background: #25D366; color: white; box-shadow: 0 5px 15px rgba(37,211,102,0.3); }
        .icon-whatsapp:hover { box-shadow: 0 0 20px rgba(37,211,102,0.6); transform: translateY(-3px); }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="bg-animate"></div>

    <main class="w-full max-w-md z-10 my-auto pt-8">

            </div>

            <div class="rgb-border-wrapper mt-8">
                <div class="glass-card p-6 md:p-8 space-y-8 flex flex-col items-center text-center">
                    
                    <div class="w-20 h-20 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-[0_0_30px_rgba(0,243,255,0.4)]">
                        <i data-lucide="shield" class="w-10 h-10 text-white"></i>
                    </div>
                    
                    <div class="flex justify-center gap-6 w-full">
                        <a href="https://www.tiktok.com/@himzxitt?_r=1&_t=ZS-96LwWh6pJp7" target="_blank" onclick="showToast('Membuka TikTok Himz...')" class="flex flex-col items-center gap-2">

                                <svg viewBox="0 0 448 512" fill="currentColor"><path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/></svg>
                            </div>

                        <a href="https://youtube.com/@himzxit?si=5TzIaAV_FkpTTDxP" target="_blank" onclick="showToast('Membuka YouTube Himz...')" class="flex flex-col items-center gap-2">
                            <div class="app-icon icon-youtube">
                                <svg viewBox="0 0 576 512" fill="currentColor"><path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.202z"/></svg>
                            </div>

                        <a href="https://whatsapp.com/channel/0029VbCbNh95EjxqPp8XAv1w" target="_blank" onclick="showToast('Membuka WA Channel...')" class="flex flex-col items-center gap-2">
                            <div class="app-icon icon-whatsapp">
                                <svg viewBox="0 0 448 512" fill="currentColor"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-23.1-115-65-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
                            </div>
                            <span class="text-[10px] uppercase font-bold text-gray-300">WhatsApp</span>
                        </a>
                    </div>

                    <button id="btn-enter" class="btn-neon w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 rounded-xl font-orbitron font-bold text-lg tracking-[0.2em] shadow-[0_0_20px_rgba(0,243,255,0.4)] hover:brightness-125 uppercase active:scale-95 transition-all mt-4">
                        MASUK
                    </button>
                </div>
            </div>
        </section>

        <section id="generator-page" class="space-y-6 hidden opacity-0 w-full">
            <div class="flex items-center justify-between mb-2">
                <button id="btn-back" class="p-3 hover:bg-white/10 rounded-full transition-colors backdrop-blur-md bg-white/5"><i data-lucide="chevron-left"></i></button>
                <h2 class="text-xl font-orbitron font-bold text-cyan-400 tracking-wider">AI GENERATOR</h2>
                <div class="w-12"></div>

            <div class="glass-card p-6 space-y-6 relative overflow-hidden border border-cyan-500/30">

                <div class="relative">

                    <div id="suggestion-box" class="absolute z-50 w-full mt-2 bg-[#050505] border border-cyan-500/30 rounded-xl max-h-60 overflow-y-auto hidden shadow-[0_10px_40px_rgba(0,0,0,0.9)]">

                    </div>
                    <div class="w-full bg-gray-900 h-2 rounded-full overflow-hidden border border-white/5">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-500 via-purple-500 to-cyan-500 w-0 transition-all duration-300 shadow-[0_0_10px_#00f3ff]"></div>
                    </div>
                </div>

                <button id="btn-generate" class="btn-neon w-full py-5 bg-gradient-to-r from-purple-600 to-blue-600 rounded-xl font-orbitron font-black text-xl tracking-widest shadow-[0_0_20px_rgba(188,19,254,0.4)] uppercase border-t border-white/20 active:scale-95 transition-all">
                    GENERATE

            </div>

            <div id="result-container" class="hidden space-y-4">
                <div class="rgb-border-wrapper">
                    <div class="glass-card p-6">
                        <h3 class="text-center font-orbitron text-sm mb-6 border-b border-white/10 pb-3 text-cyan-400 tracking-[0.2em]">HASIL OPTIMASI AI</h3>
                        <div id="results-grid" class="grid grid-cols-2 gap-3">
                            </div>
                        <div class="mt-5 pt-4 border-t border-white/10">
                            <div class="flex justify-between items-center bg-black/40 p-4 rounded-xl border border-cyan-500/30 shadow-[inset_0_0_15px_rgba(0,243,255,0.1)]">
                                <span class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider">Tombol Tembak</span>
                                <span id="fire-btn" class="font-orbitron font-black text-2xl text-white glow-blue">--</span>

                        </div>
                    </div>

                <button onclick="location.reload()" class="w-full py-4 text-[10px] uppercase tracking-widest font-bold text-gray-500 hover:text-white transition-colors">Reset Generator</button>

    </main>

    <footer class="mt-10 pb-6 opacity-30 text-[9px] font-orbitron tracking-[0.3em] z-10 uppercase text-center w-full">
        &copy; GENERATOR SENSI HIMZ
    </footer>

    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // Database Perangkat
        const devices = [
            "Infinix Hot 10", "Infinix Hot 11", "Infinix Hot 12", "Infinix Hot 20", "Infinix Hot 30", "Infinix Hot 40", 
            "Infinix Note 10", "Infinix Note 11", "Infinix Note 12", "Infinix Note 30", "Infinix Note 40",
            "Infinix GT 10 Pro", "Infinix GT 20 Pro", "Infinix Zero Ultra",
            "Xiaomi Redmi Note 10", "Xiaomi Redmi Note 11", "Xiaomi Redmi Note 12", "Xiaomi Redmi Note 13", 
            "Xiaomi Mi 11", "Xiaomi Mi 12", "Xiaomi 13 Pro", "Xiaomi 14",
            "Redmi 9", "Redmi 10", "Redmi 12", "Redmi 13",
            "Poco X3 Pro", "Poco X5 Pro", "Poco X6 Pro", "Poco F3", "Poco F4", "Poco F5", "Poco F6", "Poco M5",
            "Samsung Galaxy A14", "Samsung Galaxy A34", "Samsung Galaxy A54", "Samsung Galaxy A55", 
            "Samsung Galaxy S21", "Samsung Galaxy S22", "Samsung Galaxy S23 Ultra", "Samsung Galaxy S24 Ultra",
            "Vivo V25", "Vivo V27", "Vivo V29", "Vivo V30", "Vivo Y35", "Vivo Y22", "Vivo Y36",
            "Oppo Reno 8", "Oppo Reno 10", "Oppo Reno 11", "Oppo A58", "Oppo A78", "Oppo Find X6",
            "Realme 10 Pro", "Realme 11 Pro", "Realme 12 Pro", "Realme C55", "Realme C67", "Realme GT Master Edition", "Realme GT Neo 5",
            "Asus ROG Phone 5", "Asus ROG Phone 6", "Asus ROG Phone 7", "Asus ROG Phone 8",
            "iPhone 11", "iPhone 12 Pro", "iPhone 13 Pro Max", "iPhone 14 Pro", "iPhone 15 Pro Max"
        ];

        // Music Control
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.3;
        document.addEventListener('click', () => { bgMusic.play().catch(() => {}); }, { once: true });

        // Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.style.transform = 'translateY(0)';
            setTimeout(() => { toast.style.transform = 'translateY(200%)'; }, 3000);
        }

        // Search Logic
        const searchInput = document.getElementById('device-search');
        const suggestionBox = document.getElementById('suggestion-box');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if (val.length < 1) { suggestionBox.classList.add('hidden'); return; }

            const filtered = devices.filter(d => d.toLowerCase().includes(val));
            
            if (filtered.length > 0) {
                suggestionBox.innerHTML = filtered.map(d => `
                    <div class="suggestion-item px-5 py-4 hover:bg-cyan-900/40 cursor-pointer border-b border-white/5 last:border-0 text-sm font-medium transition-colors text-gray-200 hover:text-white">
                        ${d}
                    </div>
                `).join('');
                suggestionBox.classList.remove('hidden');
                
                document.querySelectorAll('.suggestion-item').forEach(item => {
                    item.addEventListener('click', () => {
                        searchInput.value = item.innerText;
                        suggestionBox.classList.add('hidden');
                    });
                });
            } else { suggestionBox.classList.add('hidden'); }
        });

        // Close dropdown when clicked outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionBox.contains(e.target)) {
                suggestionBox.classList.add('hidden');
            }
        });

        // Navigation Animation
        const btnEnter = document.getElementById('btn-enter');
        const homePage = document.getElementById('home-page');
        const genPage = document.getElementById('generator-page');

        btnEnter.addEventListener('click', () => {
            showToast('Mengakses AI Server...');
            gsap.to(homePage, { opacity: 0, y: -20, duration: 0.4, onComplete: () => {
                homePage.classList.add('hidden');
                genPage.classList.remove('hidden');
                gsap.fromTo(genPage, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 });
            }});
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            gsap.to(genPage, { opacity: 0, y: 20, duration: 0.4, onComplete: () => {
                genPage.classList.add('hidden');
                homePage.classList.remove('hidden');
                gsap.fromTo(homePage, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5 });
            }});
        });

        // Generator Logic
        const btnGenerate = document.getElementById('btn-generate');
        const aiStatus = document.getElementById('ai-status');
        const progressBar = document.getElementById('progress-bar');
        const progressVal = document.getElementById('progress-val');
        const typingText = document.getElementById('typing-text');
        const scanLine = document.getElementById('scan-line');
        const resultContainer = document.getElementById('result-container');

        btnGenerate.addEventListener('click', () => {
            if (!searchInput.value) { showToast('Pilih perangkat kamu dulu!'); return; }

            btnGenerate.disabled = true;
            btnGenerate.style.opacity = '0.4';
            aiStatus.classList.remove('hidden');
            scanLine.style.display = 'block';
            
            let progress = 0;
            const messages = [
                "Scanning Hardware...",
                "Analyzing Resolution...",
                "Bypassing Algorithm...",
                "Syncing AI Engine...",
                "Generating Best Setting..."
            ];
            
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 2;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    showResults();
                }
                
                progressBar.style.width = progress + '%';
                progressVal.innerText = progress + '%';
                
                const msgIdx = Math.min(Math.floor(progress / 20), messages.length - 1);
                typingText.innerText = messages[msgIdx];
            }, 120);
        });

        function showResults() {
            scanLine.style.display = 'none';
            aiStatus.classList.add('hidden');
            btnGenerate.classList.add('hidden');
            
            const results = {
                "General": Math.floor(Math.random() * (200 - 180) + 180),
                "Red Dot": Math.floor(Math.random() * (195 - 175) + 175),
                "2x Scope": Math.floor(Math.random() * (190 - 160) + 160),
                "4x Scope": Math.floor(Math.random() * (180 - 145) + 145),
                "AWM Scope": Math.floor(Math.random() * (120 - 70) + 70),
                "Free Look": Math.floor(Math.random() * (200 - 160) + 160)
            };
            
            const grid = document.getElementById('results-grid');
            grid.innerHTML = Object.entries(results).map(([key, val]) => `
                <div class="bg-black/40 border border-white/5 rounded-xl p-3 flex flex-col items-center shadow-[inset_0_0_10px_rgba(255,255,255,0.02)]">
                    <span class="text-[9px] uppercase text-cyan-400/80 font-bold mb-1 tracking-wider">${key}</span>
                    <span class="text-2xl font-orbitron font-black text-white glow-blue">${val}</span>
                </div>
            `).join('');

            document.getElementById('fire-btn').innerText = Math.floor(Math.random() * (65 - 45) + 45) + '%';
            
            resultContainer.classList.remove('hidden');
            gsap.from(resultContainer, { y: 30, opacity: 0, duration: 0.8, ease: "back.out(1.5)" });
            showToast('Sensitivitas Berhasil Ditemukan!');
        }

        // Particle System
        const canvas = document.getElementById('canvas-particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#bc13fe';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
